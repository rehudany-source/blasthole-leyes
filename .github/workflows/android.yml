name: App Android
on:
  push:
    branches: [main]
    paths: ['android-src/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copia de la página dentro de la app (para abrir sin internet la primera vez)
        run: |
          mkdir -p android-src/app/src/estable/assets android-src/app/src/pruebas/assets
          cp index.html android-src/app/src/estable/assets/index.html
          cp beta/index.html android-src/app/src/pruebas/assets/index.html
      - name: Compilar
        working-directory: android-src
        run: gradle --no-daemon -PbhlVersion=$(cat version.txt) assembleEstableRelease assemblePruebasRelease
      - name: Subir los APK al repositorio
        run: |
          V=$(cat android-src/version.txt)
          mkdir -p android
          git rm -q --ignore-unmatch 'android/*.apk' || true
          cp android-src/app/build/outputs/apk/estable/release/app-estable-release.apk android/BlastHoleLeyes_Android_V$V.apk
          cp android-src/app/build/outputs/apk/pruebas/release/app-pruebas-release.apk android/BlastHoleLeyes_Android_Pruebas_V$V.apk
          printf '{ "version": %s, "estable": "BlastHoleLeyes_Android_V%s.apk", "pruebas": "BlastHoleLeyes_Android_Pruebas_V%s.apk" }\n' $V $V $V > android/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -qm "APK Android V$V"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
